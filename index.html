<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園二手交換物品 - 智聯升級版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #4F46E5;
            --background: #F8FAFC;
        }

        body {
            font-family: 'Geist', sans-serif;
            background-color: var(--background);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 聊天對話框樣式 */
        .chat-message-sent { background-color: #4F46E5; color: white; border-bottom-right-radius: 4px; }
        .chat-message-received { background-color: #F1F5F9; color: #1E293B; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="min-h-screen text-slate-800 relative overflow-x-hidden">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-200/40 rounded-full blur-3xl -z-10"></div>
    <div class="absolute top-80 right-10 w-80 h-80 bg-purple-200/30 rounded-full blur-3xl -z-10"></div>

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-2.5 group">
                        <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center shadow-md shadow-indigo-200 group-hover:rotate-12 transition-transform">
                            <i data-lucide="refresh-cw" class="text-white w-5 h-5 animate-pulse"></i>
                        </div>
                        <span class="text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">校園二手市集</span>
                    </div>
                    
                    <div class="hidden lg:flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/60" id="categoryGroup">
                        <button onclick="setCategory('全部')" class="cat-btn px-4 py-1.5 text-sm font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm">全部</button>
                        <button onclick="setCategory('運動用品')" class="cat-btn px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-600 hover:text-slate-900">運動用品</button>
                        <button onclick="setCategory('文具')" class="cat-btn px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-600 hover:text-slate-900">文具</button>
                        <button onclick="setCategory('生活')" class="cat-btn px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-600 hover:text-slate-900">生活</button>
                        <button onclick="setCategory('其他')" class="cat-btn px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-600 hover:text-slate-900">其他</button>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="relative hidden sm:block">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="renderList(localRecords)" placeholder="搜尋好物..." class="pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 w-60 transition-all">
                    </div>
                    
                    <div id="googleAuthSection" class="flex items-center gap-3">
                        <div id="g_id_onload"
                             data-client_id="312510971650-bnu0cdaichv72tqq5ttuqb2cjc6c8ald.apps.googleusercontent.com"
                             data-callback="handleCredentialResponse"
                             data-auto_prompt="false">
                        </div>
                        <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline" data-text="signin_with" data-shape="pill"></div>
                    </div>

                    <div id="userProfileSection" class="hidden flex items-center gap-3 bg-slate-50 p-1.5 pr-3 rounded-full border border-slate-200">
                        <img id="userAvatar" src="" alt="Avatar" class="w-7 h-7 rounded-full object-cover shadow-sm">
                        <span id="userName" class="text-xs font-bold text-slate-700 max-w-[80px] truncate"></span>
                        <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500 transition-colors" title="登出">

                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="introBanner" class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-violet-900 text-white py-12 px-4 shadow-inner relative overflow-hidden">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff08_1px,transparent_1px),linear-gradient(to_bottom,#ffffff08_1px,transparent_1px)] bg-[size:24px_24px]"></div>
        <div class="max-w-4xl mx-auto text-center relative z-10 space-y-4">
            <span class="bg-indigo-500/30 text-indigo-200 text-xs font-bold px-3 py-1 rounded-full border border-indigo-400/20 uppercase tracking-widest">Campus Sharing</span>
            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">讓校園閒置物品，找到新主人</h2>
            <p class="text-indigo-200 max-w-xl mx-auto text-sm sm:text-base font-light">
                這是一個專屬於同學們的綠色交換平臺。無論是功成身退的教科書、用不上的運動器材，還是生活萌物，都能在這裡煥發新生。立即登入解鎖發佈權限！
            </p>
            <div class="pt-2 flex justify-center gap-6 text-xs sm:text-sm text-indigo-200/90 font-medium">
                <span class="flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> 校園電郵認證</span>
                <span class="flex items-center gap-1.5"><i data-lucide="leaf" class="w-4 h-4 text-emerald-400"></i> 環保永續循環</span>
                <span class="flex items-center gap-1.5"><i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i> AI 智能物價分析</span>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <div class="mb-8 p-6 bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
            <div class="flex items-center gap-6 sm:gap-10 overflow-x-auto no-scrollbar">
                <div class="flex flex-col min-w-[70px]">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Active 刊登中</span>
                    <span id="statActive" class="text-3xl font-black text-indigo-600">0</span>
                </div>
                <div class="w-px h-10 bg-slate-200"></div>
                <div class="flex flex-col min-w-[70px]">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Done 已成交</span>
                    <span id="statDone" class="text-3xl font-black text-slate-500">0</span>
                </div>
                <div class="w-px h-10 bg-slate-200"></div>
                <div class="flex flex-col min-w-[70px]">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total 總總數</span>
                    <span id="statTotal" class="text-3xl font-black text-slate-800">0</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <div class="relative bg-slate-100 rounded-xl px-3 py-1.5 border border-slate-200/60 flex items-center gap-1.5">
                    <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-slate-500"></i>
                    <select id="sortSelect" onchange="renderList(localRecords)" class="bg-transparent text-xs font-bold text-slate-600 focus:outline-none cursor-pointer">

                        <option value="priceHigh">價格：高到低</option>
                        <option value="mostViewed">最多人看</option>
                    </select>
                </div>

                <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/60" id="statusFilterGroup">
                    <button onclick="setStatusFilter('全部')" class="status-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800">全部</button>
                    <button onclick="setStatusFilter('active')" class="status-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">只看 Active</button>
                    <button onclick="setStatusFilter('done')" class="status-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800">只看 Done</button>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <h1 id="listTitle" class="text-2xl font-black tracking-tight text-slate-900">刊登中寶物</h1>
                <span id="wishlistCountBadge" class="hidden items-center gap-1 bg-rose-50 text-rose-600 text-xs font-bold px-2.5 py-1 rounded-full border border-rose-100"><i data-lucide="heart" class="w-3 h-3 fill-rose-600"></i> 收藏夾已啟用</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="handleAISummary()" id="aiBtn" class="flex items-center gap-2 bg-slate-900 text-slate-100 px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-800 transition-all active:scale-95 shadow-md shadow-slate-200 disabled:opacity-50">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                    <span id="aiBtnText">AI 市集摘要</span>
                </button>
                
                <button id="publishBtn" onclick="openModal('postModal')" disabled class="flex items-center gap-2 bg-slate-300 text-slate-500 cursor-not-allowed px-4 py-2 rounded-xl font-bold text-sm shadow-lg transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    請先登入平臺
                </button>
            </div>
        </div>

        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center h-72 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200 p-8">
            <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mb-4 border border-slate-100">
                <i data-lucide="package-search" class="w-8 h-8 text-slate-400"></i>

    <div id="postModal" class="modal-overlay">
        <div class="modal-content absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white rounded-2xl p-6 transform transition-all shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <i data-lucide="file-plus-2" class="text-indigo-600 w-5 h-5"></i>
                    <h2 class="text-xl font-bold text-slate-900">發佈二手交換物品</h2>
                </div>
                <button onclick="closeModal('postModal')" class="text-slate-400 hover:text-slate-600 p-1 hover:bg-slate-50 rounded-lg transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="postForm" onsubmit="handlePost(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500">物品名稱 <span class="text-rose-500">*</span></label>
                        <input type="text" name="title" required placeholder="例如：九成新運動鞋" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500">預估價值 (MOP) <span class="text-rose-500">*</span></label>
                        <input type="number" name="price" required min="0" placeholder="0" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500">分類 <span class="text-rose-500">*</span></label>
                        <select name="category" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">
                            <option value="運動用品">運動用品</option>
                            <option value="文具">文具</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500">物品狀況 <span class="text-rose-500">*</span></label>
                        <select name="condition" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">
                            <option value="全新">全新 (未拆封/未使用)</option>
                            <option value="九成新">九成新 (功能完好極少瑕疵)</option>
                            <option value="微瑕疵">微瑕疵 (有使用痕跡不影響功能)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500">聯絡資訊 (如：微訊號/電話/Email) <span class="text-rose-500">*</span></label>
                    <input type="text" name="contact" required placeholder="請留下聯絡方式以便買家聯絡" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500">物品描述 <span class="text-rose-500">*</span></label>
                    <textarea name="description" required placeholder="請詳細描述規格、可交換之意向物品等..." class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 min-h-[90px] transition-all"></textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500">圖片連結 (選填)</label>
                    <input type="url" name="imageUrl" placeholder="https://example.com/image.jpg" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-2.5 rounded-xl font-bold hover:opacity-95 transition-all shadow-md shadow-indigo-100 mt-2">
                    立即發佈

            </form>

    </div>

    <div id="chatModal" class="modal-overlay">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 flex flex-col h-[500px] overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-100 p-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="chatAvatar" src="" class="w-10 h-10 rounded-full object-cover shadow-sm">
                    <div>
                        <h3 id="chatUserName" class="font-bold text-slate-900 text-sm"></h3>
                        <p id="chatItemTitle" class="text-xs text-slate-500 line-clamp-1"></p>
                    </div>
                </div>
                <button onclick="closeModal('chatModal')" class="text-slate-400 hover:text-slate-600 p-1 hover:bg-slate-200 rounded-lg transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto bg-white flex flex-col gap-3"></div>

            <div class="p-3 bg-slate-50 border-t border-slate-100 flex gap-2">
                <input type="text" id="chatInput" placeholder="輸入訊息..." class="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition-colors flex items-center justify-center w-10">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="modal-overlay flex items-center justify-center cursor-zoom-out" onclick="closeModal('imageLightbox')">
        <img id="lightboxImg" src="" class="max-w-[90vw] max-h-[90vh] object-contain rounded-xl shadow-2xl" onclick="event.stopPropagation()">
        <button class="absolute top-6 right-6 text-white/70 hover:text-white bg-black/50 p-2 rounded-full transition-all">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <script>
        // --- Configuration ---
        // 請確保填入您新部署後的 Apps Script Web 應用程式網址
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLWnbfopyKt7yNakdNqyRhuEuFy-4JpwyOXBAXBiH8g0z3QNVoxDFzvWhbYF9lEY13/exec"; 

        // Global State
        let currentStatusFilter = 'active'; 
        let currentCategory = '全部';
        let localRecords = []; 
        let currentUser = null; 
        let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
        
        // Chat State
        let activeChatContext = null; 
        let chatInterval = null; // 【新增】用來管理實時輪詢定時器

        // --- Core Functions ---

        function decodeJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                return null;
            }
        }

        function handleCredentialResponse(response) {
            const userData = decodeJwt(response.credential);
            if (userData) {
                currentUser = {
                    name: userData.name,
                    email: userData.email,
                    picture: userData.picture
                };
                updateLoginUI();
                renderList(localRecords);
            }
        }

        function updateLoginUI() {
            const authSection = document.getElementById("googleAuthSection");
            const profileSection = document.getElementById("userProfileSection");
            const publishBtn = document.getElementById("publishBtn");
            const introBanner = document.getElementById("introBanner");

            if (currentUser) {
                authSection.classList.add("hidden");
                profileSection.classList.remove("hidden");
                document.getElementById("userAvatar").src = currentUser.picture;
                document.getElementById("userName").textContent = currentUser.name;
                
                publishBtn.disabled = false;
                publishBtn.className = "flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md hover:opacity-95 transition-all active:scale-95";
                publishBtn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i>發佈物品`;
                introBanner.classList.add("hidden");
            } else {
                authSection.classList.remove("hidden");
                profileSection.classList.add("hidden");
                
                publishBtn.disabled = true;
                publishBtn.className = "flex items-center gap-2 bg-slate-300 text-slate-500 cursor-not-allowed px-4 py-2 rounded-xl font-bold text-sm shadow-none transition-all";
                publishBtn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i>請先登入平臺`;
                introBanner.classList.remove("hidden");
            }
            lucide.createIcons();
        }

        function handleLogout() {
            currentUser = null;
            updateLoginUI();
            renderList(localRecords);
        }

        function toggleWishlist(id) {
            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(item => item !== id);
            } else {
                wishlist.push(id);
            }
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            renderList(localRecords);
        }

        function shareItem(title) {
            const url = window.location.href;
            navigator.clipboard.writeText(`快來看看校園二手市集的「${title}」！\n連結: ${url}`).then(() => {
                alert("已複製分享連結！");
            });
        }

        // --- 【重大更新】動態雲端聊天系統邏輯 ---
        function openChat(itemId, sellerEmail, sellerName, sellerPic, itemTitle) {
            if (!currentUser) {
                alert("請先登入後再聯絡賣家！");
                return;
            }
            if (currentUser.email === sellerEmail) {
                alert("這是您自己發佈的物品喔！");
                return;
            }
            
            // 建立跨瀏覽器唯一的聊天室房號
            const roomId = `${itemId}_${currentUser.email}`;
            activeChatContext = { roomId, sellerEmail, sellerName, sellerPic, itemTitle };
            
            document.getElementById('chatAvatar').src = sellerPic || 'https://via.placeholder.com/40';
            document.getElementById('chatUserName').textContent = sellerName;
            document.getElementById('chatItemTitle').textContent = `關於: ${itemTitle}`;
            
            // 1. 立即跟後端拉取一次最新訊息
            fetchChatMessagesFromServer();
            
            // 2. 開啟定時器每 3 秒自動同步一次後端數據，達成實時聊天效果
            clearInterval(chatInterval);
            chatInterval = setInterval(fetchChatMessagesFromServer, 3000);
            
            openModal('chatModal');
        }

        // 【新增函數】向後端獲取實時聊天數據
        async function fetchChatMessagesFromServer() {
            if (!activeChatContext || !APPS_SCRIPT_URL) return;
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getChats&roomId=${encodeURIComponent(activeChatContext.roomId)}`);
                const data = await res.json();
                if (data && data.messages) {
                    renderChatMessages(data.messages);
                }
            } catch (err) {
                console.error("實時聊天同步失敗:", err);
            }
        }

        // 【更新優化】渲染雲端返回的聊天訊息
        function renderChatMessages(messages = []) {
            const container = document.getElementById('chatMessages');
            
            // 紀錄使用者目前是不是已經拉到最下面
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 60;
            
            container.innerHTML = '';
            if(messages.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 my-auto">這裡是對話的開端，打個招呼吧！</div>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.senderEmail === currentUser.email;
                const timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const msgHtml = `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[80%] ${isMe ? 'ml-auto' : 'mr-auto'}">
                        <div class="px-3 py-2 rounded-2xl text-sm ${isMe ? 'chat-message-sent rounded-tr-none' : 'chat-message-received rounded-tl-none'}">
                            ${msg.text}
                        </div>
                        <span class="text-[10px] text-slate-400 mt-1">${timeStr}</span>
                    </div>
                `;
                container.innerHTML += msgHtml;
            });
            
            // 如果原本就在最下面，或是第一次載入，則自動滾動探底
            if (isAtBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // 【更新優化】將新訊息發布儲存至 Google 雲端
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text || !activeChatContext || !APPS_SCRIPT_URL) return;

            const newMessage = {
                senderEmail: currentUser.email,
                text: text,
                timestamp: new Date().toISOString()
            };

            input.value = ''; // 立即清空輸入框優化體驗

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: "sendChat",
                        roomId: activeChatContext.roomId,
                        message: newMessage
                    })
                });
                // 發送後立即更新一次
                fetchChatMessagesFromServer();
            } catch (err) {
                console.error("訊息發送失敗:", err);
            }
        }

        // --- View Counter Logic ---
        function recordView(id, imageUrl) {
            let records = JSON.parse(localStorage.getItem("records") || "[]");
            let item = records.find(r => r.id === id);
            if(item) {
                item.views = (item.views || 0) + 1;
                localStorage.setItem("records", JSON.stringify(records));
                
                const idx = localRecords.findIndex(r => r.id === id);
                if(idx > -1) localRecords[idx].views = item.views;
                
                const viewSpan = document.getElementById(`view-count-${id}`);
                if(viewSpan) viewSpan.textContent = item.views;
                
                // 同步更新到雲端後端
                syncToSheet({ action: "update", id: id, changes: { views: item.views } });
            }

            if(imageUrl) {
                document.getElementById('lightboxImg').src = imageUrl;
                openModal('imageLightbox');
            }
        }

        // --- Data Handling ---
        async function syncToSheet(payload) {
            if (!APPS_SCRIPT_URL) {
                console.warn("Apps Script URL 未設定");
                return;
            }
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Google Sheet 同步失敗:", err);
            }
        }

        function normalizeRecord(record) {
            return {
                id: record.id || record.ID || "",
                createdAt: record.createdAt || record.CreatedAt || "",
                title: record.title || record.Title || "",
                description: record.description || record.Description || "",
                category: record.category || record.Category || "其他",
                price: record.price !== undefined ? record.price : (record.Price || 0),
                imageUrl: record.imageUrl || record.ImageUrl || "",
                status: record.status || record.Status || "active",
                condition: record.condition || record.Condition || "九成新",
                contact: record.contact || record.Contact || "未提供",
                views: record.views || 0,
                publisher: record.publisher || { name: "匿名同學", email: "", picture: "" } 
            };
        }

        async function fetchRecordsFromSheet() {
            if (!APPS_SCRIPT_URL) return null;
            try {
                const res = await fetch(APPS_SCRIPT_URL);
                const data = await res.json();
                const rawArray = data.records || (Array.isArray(data) ? data : null);
                return Array.isArray(rawArray) ? rawArray.map(normalizeRecord) : null;
            } catch (e) {
                return null;
            }
        }

        async function loadData() {
            const remote = await fetchRecordsFromSheet();
            if (remote) {
                localStorage.setItem("records", JSON.stringify(remote));
                localRecords = remote;
                return remote;
            }
            const data = localStorage.getItem("records");
            localRecords = data ? JSON.parse(data).map(normalizeRecord) : [];
            return localRecords;
        }

        async function saveData(newRecord) {
            const records = await loadData();
            records.push(newRecord);
            localStorage.setItem("records", JSON.stringify(records));
            await syncToSheet({ action: "create", record: newRecord });
            await renderList(records);
        }

        async function renderList(recordsOverride) {
            const allRecords = recordsOverride || await loadData();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('itemsGrid');
            const emptyState = document.getElementById('emptyState');
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = allRecords.filter(item => {
                const statusMatch = currentStatusFilter === '全部' || item.status === currentStatusFilter;
                const categoryMatch = currentCategory === '全部' || item.category === currentCategory;
                const searchMatch = (item.title || '').toLowerCase().includes(searchTerm) || 
                                    (item.description || '').toLowerCase().includes(searchTerm);
                return statusMatch && categoryMatch && searchMatch;
            });

            if (sortVal === 'priceLow') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortVal === 'priceHigh') {
                filtered.sort((a, b) => b.price - a.price);
            } else if (sortVal === 'mostViewed') {
                filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
            } else {
                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }

            document.getElementById('statActive').innerText = allRecords.filter(r => r.status === 'active').length;
            document.getElementById('statDone').innerText = allRecords.filter(r => r.status === 'done').length;
            document.getElementById('statTotal').innerText = allRecords.length;

            document.getElementById('wishlistCountBadge').classList.toggle('hidden', wishlist.length === 0);

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const isFavorite = wishlist.includes(item.id);
                const isOwner = currentUser && item.publisher && currentUser.email === item.publisher.email && currentUser.email !== "";
                
                const statusBadge = item.status === 'active' 
                    ? '<span class="bg-emerald-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-sm uppercase tracking-wider">Active</span>'
                    : '<span class="bg-slate-400 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-sm uppercase tracking-wider">Done</span>';

                let conditionClass = "bg-slate-100 text-slate-600";
                if (item.condition === '全新') conditionClass = "bg-rose-50 text-rose-600 border border-rose-100";
                if (item.condition === '九成新') conditionClass = "bg-amber-50 text-amber-600 border border-amber-100";

                const safePublisherName = item.publisher?.name || "匿名同學";
                const safePublisherPic = item.publisher?.picture || "https://via.placeholder.com/20";
                const safePublisherEmail = item.publisher?.email || "";

                const cardHTML = `
                    <div class="group bg-white rounded-2xl border border-slate-100 overflow-hidden hover:shadow-xl hover:shadow-indigo-100/40 hover:-translate-y-1 transition-all duration-300 flex flex-col h-full relative">
                        <div class="relative h-44 overflow-hidden bg-slate-50 cursor-zoom-in" onclick="recordView('${item.id}', '${item.imageUrl || ''}')" title="點擊放大圖片">
                            ${item.imageUrl 
                                ? `<img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">`
                                : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i data-lucide="image" class="w-10 h-10"></i></div>`
                            }
                            <div class="absolute top-3 left-3 z-10">
                                ${statusBadge}
                            </div>
                            <div class="absolute top-3 right-3 z-10 flex flex-col gap-2">
                                <button onclick="event.stopPropagation(); toggleWishlist('${item.id}')" class="w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center shadow-sm text-slate-400 hover:text-rose-500 transition-colors">
                                    <i data-lucide="heart" class="w-4 h-4 ${isFavorite ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                </button>
                                <button onclick="event.stopPropagation(); shareItem('${item.title}')" class="w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center shadow-sm text-slate-400 hover:text-indigo-500 transition-colors">
                                    <i data-lucide="share-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="absolute bottom-2 right-2 bg-black/40 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                                <i data-lucide="eye" class="w-3 h-3"></i> <span id="view-count-${item.id}">${item.views || 0}</span>
                            </div>
                        </div>
                        
                        <div class="p-5 flex flex-col flex-1">
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <h3 class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors line-clamp-1">${item.title}</h3>
                                <span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded-md shrink-0">${item.category}</span>
                            </div>
                            
                            <div class="flex gap-1.5 mb-3">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded ${conditionClass}">${item.condition}</span>
                            </div>

                            <p class="text-slate-500 text-xs line-clamp-2 mb-4 h-8">${item.description}</p>
                            
                            <div class="flex items-center justify-between mb-4 mt-auto">
                                <span class="text-lg font-black text-slate-900">MOP ${item.price}</span>
                                
                                <div class="flex gap-1">
                                    ${!isOwner ? `
                                        <button onclick="openChat('${item.id}', '${safePublisherEmail}', '${safePublisherName}', '${safePublisherPic}', '${item.title}')" class="flex items-center gap-1 text-[11px] font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1.5 rounded-lg transition-colors" title="開啟聊天室聯絡賣家">
                                            <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> 聯絡賣家
                                        </button>
                                    ` : `
                                        <span class="flex items-center gap-1 text-[11px] font-bold bg-slate-100 text-slate-400 px-2.5 py-1.5 rounded-lg">您的物品</span>
                                    `}

                                    ${isOwner ? `
                                        <div class="flex border-l border-slate-100 pl-1 ml-1 gap-0.5">
                                            ${item.status === 'active' ? `
                                                <button onclick="toggleStatus('${item.id}', 'done')" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all" title="標記為已售出">
                                                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                                                </button>
                                            ` : `
                                                <button onclick="toggleStatus('${item.id}', 'active')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="重新上架">
                                                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                                </button>
                                            `}
                                            <button onclick="deleteRecord('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="下架刪除">
                                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            
                            <div class="pt-3 border-t border-slate-50 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <img src="${safePublisherPic}" alt="avatar" class="w-5 h-5 rounded-full object-cover border border-slate-200">
                                    <span class="text-[11px] font-medium text-slate-600 truncate max-w-[100px]">${safePublisherName}</span>
                                </div>
                                <span class="text-[10px] text-slate-400 font-medium">${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : ''}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });

            lucide.createIcons();
        }

        // --- UI Modal Controls ---
        function openModal(modalId) {
            if(modalId === 'postModal' && !currentUser) { 
                alert('請先完成 Google 登入後再發佈物品！'); 
                return; 
            }
            document.getElementById(modalId).style.display = 'block';
        }

        // 【更新優化】關閉彈窗時釋放實時對話輪詢計時器
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if(modalId === 'postModal') document.getElementById('postForm').reset();
            if(modalId === 'chatModal') {
                activeChatContext = null;
                clearInterval(chatInterval); // 關閉對話時清除定時器，避免浪費伺服器資源
            }
        }

        async function handlePost(e) {
            e.preventDefault();
            if(!currentUser) return;

            const formData = new FormData(e.target);
            
            const newRecord = {
                id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
                createdAt: new Date().toISOString(),
                title: formData.get('title'),
                description: formData.get('description'),
                category: formData.get('category'),
                price: parseFloat(formData.get('price')),
                imageUrl: formData.get('imageUrl'),
                status: "active",
                condition: formData.get('condition'), 
                contact: formData.get('contact'),
                views: 0,
                publisher: {
                    name: currentUser.name,
                    email: currentUser.email,
                    picture: currentUser.picture
                }
            };

            await saveData(newRecord);
            closeModal('postModal');
        }

        async function setStatusFilter(status) {
            currentStatusFilter = status;
            const buttons = document.querySelectorAll('#statusFilterGroup button');
            buttons.forEach(btn => {
                const isActive = (status === '全部' && btn.innerText === '全部') || 
                                 (status === 'active' && btn.innerText.includes('Active')) || 
                                 (status === 'done' && btn.innerText.includes('Done'));
                
                btn.className = isActive 
                    ? "status-btn px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200"
                    : "status-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800";
            });
            await renderList(localRecords);
        }

        async function setCategory(cat) {
            currentCategory = cat;
            document.getElementById('listTitle').innerText = cat === '全部' ? '刊登中寶物' : cat;
            const buttons = document.querySelectorAll('#categoryGroup button');
            buttons.forEach(btn => {
                btn.className = (btn.innerText === cat)
                    ? "cat-btn px-4 py-1.5 text-sm font-bold rounded-lg transition-all bg-white text-indigo-600 shadow-sm border border-slate-200"
                    : "cat-btn px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-900";
            });
            await renderList(localRecords);
        }

        async function toggleStatus(id, newStatus) {
            const records = await loadData();
            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index].status = newStatus;
                localStorage.setItem("records", JSON.stringify(records));
                await renderList(records);
                await syncToSheet({ action: "update", id: id, changes: { status: newStatus } });
            }
        }

        async function deleteRecord(id) {
            if (confirm('確定要下架並刪除此物品嗎？')) {
                let records = await loadData();
                records = records.filter(r => r.id !== id);
                localStorage.setItem("records", JSON.stringify(records));
                await renderList(records);
                await syncToSheet({ action: "delete", id: id });
            }
        }

        // --- AI Summary Functions ---
        async function askAI(userPrompt) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "askAI", prompt: userPrompt })
            });
            const data = await res.json();
            return data.result || data.error || "AI 沒有回應";
        }

        async function handleAISummary() {
            const btn = document.getElementById('aiBtn');
            const text = document.getElementById('aiBtnText');
            btn.disabled = true;
            text.textContent = '分析市集中...';
            try {
                const records = await loadData();
                if (records.length === 0) { alert('目前沒有二手物品資料可以分析。'); return; }
                
                const summaryInput = records.slice(0, 30).map(r =>
                    `[${r.category}] 名稱: ${r.title}, 價格: MOP ${r.price}, 描述: ${r.description}`
                ).join('\n');
                
                const prompt = '以下是校園二手交換平臺目前的上架物品列表。請用繁體中文，用 3-5 句概括目前同學們最主要出清的物品類型、價格範圍落點、以及給買家或賣家的實用市集建議:\n\n' + summaryInput;
                
                const result = await askAI(prompt);
                alert(result);
            } catch (e) {
                alert('AI 分析出錯：' + e.message);
            } finally {
                btn.disabled = false;
                text.textContent = 'AI 市集摘要';
            }
        }

        // Initialize display
        window.onload = async () => {
            updateLoginUI(); 
            await renderList();
            lucide.createIcons();
        };

        // 點擊 Modal 外圍自動關閉
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = 'none';
                if(event.target.id === 'chatModal') {
                    activeChatContext = null;
                    clearInterval(chatInterval); // 外部點擊關閉也清除定時器
                }
            }
        }
    </script>
</body>
</html>
